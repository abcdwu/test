name: Deploy private mistake sync

# Fly.io hosts the authoritative sync API and the persistent SQLite volume.
# Publish the same client revision as GitHub Pages on every main update.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt an in-flight database-backed deploy. GitHub keeps the newest
# pending run and deploys it after the current one completes.
concurrency:
  group: fly-mistake-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check deployment authorization
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'Add repository secret FLY_API_TOKEN first.'; exit 1; }
          test "${#LOGIN_PASSWORD}" -ge 1 || { echo 'Set LOGIN_PASSWORD to at least 1 character.'; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy code while preserving the mounted SQLite data volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: python3 scripts/deploy_fly.py
      - name: Verify Fly static assets and bank are the same Git revision
        run: node tests/live-bank-check.mjs
        env:
          MBE_PUBLIC_TARGET: fly
      - name: Check two independent sessions on the live sync API (read-only)
        env:
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: node tests/live-sync-check.mjs
