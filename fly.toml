app = "abcdwu-mbe-mistakes"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/mistakes.sqlite"
  ALLOWED_ORIGINS = "https://test.chaoxu.me,https://abcdwu.github.io,https://abcdwu-mbe-mistakes.fly.dev"

[[mounts]]
  source = "mistake_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 30
  scheduled_snapshots = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
