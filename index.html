<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f2"><title>MBE 练习室</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:#202b29;background:#f4f5f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:760px;margin:auto;padding:28px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:58px}.brand{font-size:15px;letter-spacing:.03em;font-weight:750}.brand span{color:#55766b}.pill{font-size:12px;color:#687b72;background:#e6ebe5;border-radius:30px;padding:8px 12px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#71877b;font-weight:700;text-transform:uppercase}h1{font-size:clamp(36px,8vw,56px);letter-spacing:-.06em;line-height:1.08;margin:14px 0}h2{font-size:25px;letter-spacing:-.04em}p{line-height:1.65}.sub{color:#6b7871;font-size:15px}.card{background:#fff;border:1px solid #e8ece7;border-radius:24px;padding:28px;box-shadow:0 12px 40px #243c2d08}.setup{margin-top:38px}.label{font-size:14px;font-weight:700;margin-bottom:14px}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.count{border:1px solid #e2e9e2;background:#f8faf7;border-radius:14px;padding:15px 4px;color:#52615a;font-weight:650}.count.active{background:#e4eee6;color:#315e47;border-color:#8dac97}.primary{border:0;background:#315d49;color:white;border-radius:15px;padding:16px 22px;font-weight:700;width:100%;margin-top:24px}.primary:disabled{opacity:.4}.note{font-size:12px;color:#8b9990;text-align:center;margin:20px 0 0}.bar{height:5px;background:#e3eae3;border-radius:8px;overflow:hidden;margin:20px 0 34px}.bar div{height:100%;background:#668d74;transition:width .2s}.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#728278}.question{white-space:pre-wrap;line-height:1.75;font-family:Georgia,serif;font-size:16px;color:#28342f}.options{display:grid;gap:10px;margin-top:24px}.option{display:flex;gap:13px;text-align:left;align-items:flex-start;width:100%;border:1px solid #e4eae4;background:#fff;border-radius:15px;padding:15px;color:#324038;line-height:1.5}.option.selected{border-color:#688e73;background:#eff5f0}.letter{font-family:-apple-system,sans-serif;font-weight:700;color:#728779;min-width:21px}.nav{display:flex;gap:10px;margin-top:20px}.nav button{flex:1}.secondary{border:1px solid #dae3da;background:#fff;color:#52665a;border-radius:15px;padding:15px}.nav .primary{margin:0}.results-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.score{font-size:48px;letter-spacing:-.06em;font-weight:750;color:#315d49}.result{margin:14px 0}.result-title{display:flex;gap:10px;align-items:center;font-weight:700}.mark{font-size:21px;color:#37845b}.mark.bad{color:#c55050}.result .question{font-size:15px}.result-options{display:grid;gap:7px;margin:20px 0}.ro{font-size:14px;padding:10px 12px;border-radius:10px;background:#f7f9f6;line-height:1.5}.ro.correct{color:#266945;background:#eaf5ed}.ro.wrong{color:#a53e3e;background:#fbefed}.explain{border-top:1px solid #edf0eb;padding-top:18px;white-space:pre-wrap;color:#53615a;font:14px/1.75 Georgia,serif}.explain strong{font:700 13px -apple-system,sans-serif;color:#526d5b}.link{border:0;background:none;color:#708478;padding:0}.foot{color:#98a49b;font-size:12px;margin-top:30px;line-height:1.6}@media(max-width:500px){main{padding:22px 16px 60px}.top{margin-bottom:42px}.card{padding:21px}.counts{gap:7px}.results-head{align-items:start}.question{font-size:15px}}
</style></head><body><main><div class="top"><div class="brand"><span>●</span> MBE 练习室</div><div class="pill">个人练习空间</div></div><div id="app"><p class="sub">正在载入题库…</p></div></main><script>
let bank=[], quiz=[], answers=[], index=0, count=10;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){app.innerHTML=`<div class="eyebrow">A little progress, every day</div><h1>专注练习，<br>从容备考。</h1><p class="sub">每一次练习，都是离目标更近一步。<br>随机抽题，交卷后查看完整解析。</p><section class="card setup"><div class="label">这次想做多少题？</div><div class="counts">${[5,10,15,20].map(n=>`<button class="count ${n===count?'active':''}" onclick="count=${n};home()">${n} 题</button>`).join('')}</div><button class="primary" onclick="start()">开始练习　→</button><p class="note">题目随机排列 · 共 ${bank.length} 道可用题目</p></section><p class="foot">题目与解析来自你提供的 PDF，保留英文原文。题库只包含可从解析中匹配答案的题目。</p>`}
function start(){quiz=shuffle(bank).slice(0,count);answers=Array(count).fill(null);index=0;render();window.scrollTo(0,0)}
function render(){let q=quiz[index];app.innerHTML=`<div class="meta"><button class="link" onclick="if(confirm('返回首页将结束本次练习，确定吗？'))home()">← 退出练习</button><span>${index+1} / ${quiz.length}</span></div><div class="bar"><div style="width:${(index+1)/quiz.length*100}%"></div></div><div class="eyebrow">Question ${String(index+1).padStart(2,'0')}</div><h2>选择最佳答案</h2><section class="card"><div class="question">${esc(q.stem)}</div><div class="options">${q.choices.map((x,i)=>`<button class="option ${answers[index]===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div></section><div class="nav">${index?'<button class="secondary" onclick="move(-1)">上一题</button>':''}${index<quiz.length-1?'<button class="primary" onclick="move(1)">下一题　→</button>':'<button class="primary" onclick="submitQuiz()">交卷并查看解析</button>'}</div><p class="note">已作答 ${answers.filter(x=>x!==null).length} / ${quiz.length} 题</p>`}
function choose(i){answers[index]=i;render()}function move(n){index+=n;render();window.scrollTo(0,0)}function submitQuiz(){let missing=answers.filter(x=>x===null).length;if(missing&&!confirm(`还有 ${missing} 题未作答，将按错误计分。确定交卷吗？`))return;results()}
function results(){let score=quiz.filter((q,i)=>'ABCD'[answers[i]]===q.answer).length;app.innerHTML=`<div class="eyebrow">Practice complete</div><div class="results-head"><div><h1>练习完成。</h1><p class="sub">回顾每一道题，让理解更扎实。</p></div><div class="score">${score}<span style="font-size:18px;color:#a0aea4"> / ${quiz.length}</span></div></div>${quiz.map((q,i)=>{let ok='ABCD'[answers[i]]===q.answer;return `<section class="card result"><div class="result-title"><span class="mark ${ok?'':'bad'}">${ok?'✓':'✕'}</span> 第 ${i+1} 题 <span style="font-size:12px;color:#92a098;font-weight:400">${ok?'回答正确':answers[i]===null?'未作答':'回答错误'}</span></div><p class="question">${esc(q.stem)}</p><div class="result-options">${q.choices.map((x,j)=>`<div class="ro ${'ABCD'[j]===q.answer?'correct':answers[i]===j?'wrong':''}">${'ABCD'[j]}. ${esc(x)} ${'ABCD'[j]===q.answer?' ✓ 正确答案':answers[i]===j?' ✕ 你的答案':''}</div>`).join('')}</div><div class="explain"><strong>原文解析</strong>\n\n${esc(q.explanation)}</div></section>`}).join('')}<button class="primary" onclick="home();window.scrollTo(0,0)">再练一组</button><p class="foot">解析来自所提供的 PDF；答案依据原文选项说明匹配。建议对疑义题目核对原始材料。</p>`;window.scrollTo(0,0)}
fetch('questions.txt').then(async r=>{if(!r.ok)throw Error();let b=Uint8Array.from(atob(await r.text()),c=>c.charCodeAt(0));let stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}).then(q=>{bank=q;home()}).catch(()=>app.innerHTML='<p>题库载入失败，请刷新页面重试。</p>');
</script></body></html>
